name: Desktop framework checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:desktop
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: carelink-windows-x64-installer
          path: release/*Setup.exe
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-results
          path: |
            test-results/
            test-results-desktop/
